name: Build APK

on:
  # Tự chạy mỗi khi tải mã lên GitHub
  push:
  # Cho phép bấm chạy tay: tab Actions > Build APK > Run workflow
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Android SDK và chấp nhận giấy phép
        uses: android-actions/setup-android@v3

      - name: Cài Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK debug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Tải APK lên để tải về
        uses: actions/upload-artifact@v4
        with:
          name: StudyLock-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
